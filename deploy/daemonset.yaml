# Runs healerd on every node. Kubernetes-friendly actions are cordon_node,
# webhook and exec; restart_systemd needs host systemd access and is not
# available from inside the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healerd
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: healerd
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: healerd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: healerd
subjects:
  - kind: ServiceAccount
    name: healerd
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: healerd
  namespace: kube-system
spec:
  selector:
    matchLabels: { app: healerd }
  template:
    metadata:
      labels: { app: healerd }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: healerd
      hostPID: true
      containers:
        - name: healerd
          image: ghcr.io/mohsinkhanshaik/healerd:latest
          args: ["-config", "/etc/healerd/healerd.yaml"]
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            privileged: true
          ports:
            - { name: metrics, containerPort: 9464 }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/healerd }
            - { name: tracefs, mountPath: /sys/kernel/tracing }
            - { name: debugfs, mountPath: /sys/kernel/debug }
      volumes:
        - name: config
          configMap: { name: healerd }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing }
        - name: debugfs
          hostPath: { path: /sys/kernel/debug }
